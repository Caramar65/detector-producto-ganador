name: Ensure Supabase client is loaded

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !contains(github.event.head_commit.message, '[skip supabase patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script tag is in the real page body
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/supabase-client.js" defer></script>'
          text = text.replace(tag + '\n', '').replace(tag, '')
          marker = '\n</body>\n</html>'
          if marker not in text:
              raise SystemExit('No se encontró el cierre real de index.html')
          text = text.replace(marker, '\n' + tag + marker, 1)
          p.write_text(text, encoding='utf-8')
          print('Supabase script tag colocado en el body real de index.html.')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios.'
            exit 0
          fi
          git commit -m 'Fix Supabase integration placement [skip supabase patch]'
          git push
