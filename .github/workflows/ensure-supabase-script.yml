name: Ensure Supabase client is loaded

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !contains(github.event.head_commit.message, '[skip supabase patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script tag exists
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/supabase-client.js" defer></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('No se encontró </body> en index.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Supabase script tag agregado.')
          else:
              print('El script de Supabase ya estaba incluido.')

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sin cambios.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Supabase integration in production [skip supabase patch]'
          git push
