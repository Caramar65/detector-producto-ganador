name: Fix report history and full download

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* DP_GANADOR_V38_ENHANCEMENTS */'

          if marker not in s:
              raise SystemExit('No se encontró el bloque de mejoras existente.')

          patch = r'''/* DP_GANADOR_V39_ENHANCEMENTS */
          (function(){
            const STYLE = `<style id="dp-v39-style">
              .dp-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
              .dp-tools button{padding:10px 13px}
              .dp-history{background:#eefaf1;border:1px solid #c9ecd4;padding:14px;border-radius:12px;margin-top:16px}
              .dp-history-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #dfe9e2}
              .dp-history-row:last-child{border-bottom:0}
              .dp-history-actions{display:flex;gap:6px;flex-wrap:wrap}
              .dp-danger{background:#fff0ef!important;color:#b42318!important}
              .dp-full-report{white-space:pre-wrap}
            </style>`;

            document.head.insertAdjacentHTML('beforeend', STYLE);

            let lastData = null;
            let lastProducts = null;
            let lastCreatedAt = null;

            const originalRender = window.render;
            if(typeof originalRender === 'function'){
              window.render = function(data, inputProducts){
                lastData = data;
                lastProducts = Array.isArray(inputProducts) ? inputProducts : [];
                lastCreatedAt = new Date().toISOString();
                return originalRender(data, inputProducts);
              };
            }

            function getHistory(){
              try{
                const raw = localStorage.getItem('dpganador_history');
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
              }catch(e){
                console.error('Historial corrupto:', e);
                return [];
              }
            }

            function setHistory(items){
              localStorage.setItem('dpganador_history', JSON.stringify(items.slice(0,20)));
            }

            function winnerOf(data){
              return data?.overallWinner || data?.products?.[0] || {};
            }

            function restoreInputs(products){
              if(!Array.isArray(products)) return;
              for(let i=1;i<=5;i++){
                const p = products[i-1] || {};
                const values = {
                  ['n'+i]: p.productName || p.name || '',
                  ['d'+i]: p.description || '',
                  ['u'+i]: p.url || '',
                  ['c'+i]: p.cost ?? '',
                  ['s'+i]: p.shipping ?? 0,
                  ['o'+i]: p.otherCosts ?? 0,
                  ['p'+i]: p.salePrice ?? '',
                  ['r'+i]: p.returns ?? 5
                };
                Object.entries(values).forEach(([id,value])=>{
                  const el = document.getElementById(id);
                  if(el) el.value = value;
                });
              }
              if(typeof window.updateProductCount === 'function') window.updateProductCount();
            }

            function fullReportText(data, products, createdAt){
              const w = winnerOf(data);
              const lines = [];
              const date = createdAt ? new Date(createdAt) : new Date();

              lines.push('DETECTOR DE PRODUCTO GANADOR — INFORME COMPLETO');
              lines.push('='.repeat(70));
              lines.push(`Fecha: ${date.toLocaleString('es-CO')}`);
              lines.push('');

              lines.push('1. PRODUCTOS ANALIZADOS');
              lines.push('-'.repeat(70));
              (products || []).forEach((p,i)=>{
                lines.push(`Producto ${i+1}: ${p.productName || p.name || ''}`);
                lines.push(`Descripción: ${p.description || 'No proporcionada'}`);
                lines.push(`URL: ${p.url || 'No proporcionada'}`);
                lines.push(`Costo: ${p.cost ?? 0} COP`);
                lines.push(`Envío: ${p.shipping ?? 0} COP`);
                lines.push(`Otros costos: ${p.otherCosts ?? 0} COP`);
                lines.push(`Precio de venta: ${p.salePrice ?? 0} COP`);
                lines.push(`Devoluciones/no recibidos: ${p.returns ?? 0}%`);
                lines.push('');
              });

              lines.push('2. GANADOR GENERAL');
              lines.push('-'.repeat(70));
              lines.push(`Producto: ${w.productName || ''}`);
              lines.push(`Score: ${w.overallScore ?? w.score ?? 0}/100`);
              lines.push(`Prioridad/veredicto: ${w.priority || w.verdict || w.decision || ''}`);
              lines.push(`Plataforma recomendada: ${w.recommendedPlatform || ''}`);
              lines.push(`Razón final: ${w.finalReason || w.summary || ''}`);
              lines.push('');

              lines.push('3. GANADORES POR PLATAFORMA');
              lines.push('-'.repeat(70));
              const meta = data?.metaWinner || {};
              const tik = data?.tiktokWinner || {};
              lines.push(`Meta Ads: ${meta.productName || ''} — ${meta.metaScore ?? 0}/100`);
              lines.push(`Razón Meta: ${meta.platformReason || ''}`);
              lines.push(`TikTok Ads: ${tik.productName || ''} — ${tik.tiktokScore ?? 0}/100`);
              lines.push(`Razón TikTok: ${tik.platformReason || ''}`);
              lines.push('');

              lines.push('4. RANKING COMPLETO');
              lines.push('-'.repeat(70));
              const ranked = Array.isArray(data?.products) ? data.products : [];
              ranked.forEach((p,i)=>{
                lines.push(`${i+1}. ${p.productName || ''} — ${p.overallScore ?? 0}/100`);
                lines.push(`   Demanda: ${p.demand ?? 0}/5 | Competencia: ${p.competitionOpportunity ?? 0}/5 | Visual: ${p.visual ?? 0}/5 | Diferenciación: ${p.differentiation ?? 0}/5 | Impulso: ${p.impulse ?? 0}/5`);
                lines.push(`   Economía: ${p.economicScore ?? 0}/100 | Meta: ${p.metaScore ?? 0}/100 | TikTok: ${p.tiktokScore ?? 0}/100`);
                lines.push(`   Veredicto: ${p.verdict || p.priority || p.decision || ''}`);
                lines.push('');
              });

              lines.push('5. ECONOMÍA DEL GANADOR');
              lines.push('-'.repeat(70));
              lines.push(`Margen: ${w.margin ?? 0} COP (${Number(w.marginPercent || 0).toFixed(2)}%)`);
              lines.push(`CPA máximo: ${w.maxCPA ?? 0} COP`);
              lines.push(`CPA objetivo: ${w.targetCPA ?? 0} COP`);
              lines.push(`ROAS equilibrio: ${Number(w.breakEvenROAS || 0).toFixed(2)}x`);
              lines.push('');

              lines.push('6. RECOMENDACIÓN');
              lines.push('-'.repeat(70));
              lines.push(data?.recommendation || '');
              lines.push('');

              lines.push('7. FORTALEZAS');
              lines.push('-'.repeat(70));
              (w.strengths || []).forEach(x=>lines.push(`- ${x}`));
              lines.push('');

              lines.push('8. DEBILIDADES');
              lines.push('-'.repeat(70));
              (w.weaknesses || []).forEach(x=>lines.push(`- ${x}`));
              lines.push('');

              lines.push('9. RIESGOS');
              lines.push('-'.repeat(70));
              (w.risks || []).forEach(x=>lines.push(`- ${x}`));
              lines.push('');

              lines.push('10. ÁNGULOS');
              lines.push('-'.repeat(70));
              (w.angles || []).forEach((x,i)=>lines.push(`${i+1}. ${x}`));
              lines.push('');

              lines.push('11. PLAN DE TEST');
              lines.push('-'.repeat(70));
              (w.testPlan || []).forEach((x,i)=>lines.push(`${i+1}. ${x}`));
              lines.push('');

              lines.push('12. INVESTIGACIÓN / NOTAS');
              lines.push('-'.repeat(70));
              (data?.researchNotes || []).forEach(x=>lines.push(`- ${x}`));
              lines.push('');

              lines.push('13. FUENTES VERIFICABLES');
              lines.push('-'.repeat(70));
              (data?.sources || []).forEach((x,i)=>{
                lines.push(`${i+1}. ${x.title || x.name || 'Fuente'}`);
                lines.push(`   URL: ${x.url || ''}`);
                if(x.note) lines.push(`   Nota: ${x.note}`);
              });
              lines.push('');
              lines.push('FIN DEL INFORME');
              return lines.join('\n');
            }

            function tools(){
              if(document.getElementById('dpTools')) return;
              const report = document.getElementById('report');
              if(!report) return;
              report.insertAdjacentHTML('beforeend', `<div id="dpTools" class="dp-tools">
                <button class="primary" id="dpSave">💾 GUARDAR</button>
                <button class="ghost" id="dpDownload">📄 DESCARGAR INFORME COMPLETO</button>
                <button class="ghost" id="dpEmail">📧 ENVIAR RESUMEN POR EMAIL</button>
              </div>`);
              document.getElementById('dpSave').onclick = save;
              document.getElementById('dpDownload').onclick = download;
              document.getElementById('dpEmail').onclick = email;
            }

            function save(){
              if(!lastData) return status('Primero realiza una investigación.',true);
              const all = getHistory();
              const w = winnerOf(lastData);
              const item = {
                id:'research_'+Date.now(),
                createdAt:lastCreatedAt || new Date().toISOString(),
                products:lastProducts || [],
                data:lastData
              };
              all.unshift(item);
              setHistory(all);
              history();
              status(`💾 Investigación guardada: ${w.productName || 'resultado'}.`);
            }

            function download(){
              if(!lastData) return status('Primero realiza una investigación.',true);
              const text = fullReportText(lastData,lastProducts,lastCreatedAt);
              const blob = new Blob([text],{type:'text/plain;charset=utf-8'});
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `investigacion-completa-${new Date().toISOString().slice(0,10)}.txt`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(()=>URL.revokeObjectURL(url),1000);
              status('📄 Informe completo descargado con productos, análisis, investigación y fuentes.');
            }

            function email(){
              if(!lastData) return status('Primero realiza una investigación.',true);
              const w = winnerOf(lastData);
              const meta = lastData.metaWinner || {};
              const tik = lastData.tiktokWinner || {};
              const subject = `Detector de Producto Ganador — ${w.productName || 'Resultado'} — ${w.overallScore ?? 0}/100`;
              const body = [
                'RESUMEN EJECUTIVO',
                '',
                `Ganador general: ${w.productName || ''}`,
                `Score: ${w.overallScore ?? w.score ?? 0}/100`,
                `Plataforma recomendada: ${w.recommendedPlatform || ''}`,
                `Ganador Meta Ads: ${meta.productName || ''} — ${meta.metaScore ?? 0}/100`,
                `Ganador TikTok Ads: ${tik.productName || ''} — ${tik.tiktokScore ?? 0}/100`,
                `Margen: ${w.margin ?? 0} COP (${Number(w.marginPercent || 0).toFixed(1)}%)`,
                `CPA máximo: ${w.maxCPA ?? 0} COP`,
                `CPA objetivo: ${w.targetCPA ?? 0} COP`,
                `ROAS equilibrio: ${Number(w.breakEvenROAS || 0).toFixed(2)}x`,
                '',
                'Recomendación:',
                lastData.recommendation || '',
                '',
                'Principales fortalezas:',
                ...(w.strengths || []).slice(0,3).map(x=>`- ${x}`),
                '',
                'Principales riesgos:',
                ...(w.risks || []).slice(0,3).map(x=>`- ${x}`),
                '',
                'El informe completo con la investigación y las fuentes queda disponible para descargar desde la aplicación.'
              ].join('\n');
              location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            }

            function openSaved(item){
              if(!item || !item.data) return;
              lastData = item.data;
              lastProducts = Array.isArray(item.products) ? item.products : [];
              lastCreatedAt = item.createdAt || new Date().toISOString();
              restoreInputs(lastProducts);
              if(typeof window.render === 'function') window.render(item.data,lastProducts);
              status('📂 Investigación cargada desde el historial.');
              window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
            }

            function deleteSaved(id){
              const all = getHistory();
              const item = all.find(x=>x.id===id);
              const w = winnerOf(item?.data || {});
              if(!confirm(`¿Eliminar la investigación de "${w.productName || 'este informe'}"? Esta acción no se puede deshacer.`)) return;
              setHistory(all.filter(x=>x.id!==id));
              history();
              status('🗑️ Investigación eliminada.');
            }

            function clearHistory(){
              const all = getHistory();
              if(!all.length) return status('No hay investigaciones guardadas.');
              if(!confirm('¿Eliminar TODAS las investigaciones guardadas en este navegador? Esta acción no se puede deshacer.')) return;
              localStorage.removeItem('dpganador_history');
              history();
              status('🗑️ Historial eliminado por completo.');
            }

            function history(){
              let box = document.getElementById('dpHistory');
              if(!box){
                box = document.createElement('div');
                box.id = 'dpHistory';
                box.className = 'dp-history';
                const main = document.querySelector('main');
                if(main) main.appendChild(box);
              }

              const all = getHistory();
              if(!all.length){
                box.style.display = 'none';
                box.innerHTML = '';
                return;
              }

              box.style.display = 'block';
              box.innerHTML = `<h2>💾 Investigaciones guardadas</h2>
                <p class="muted">Guardadas localmente en este navegador. Se conservan aunque inicies una nueva investigación.</p>
                ${all.map(x=>{
                  const w = winnerOf(x.data || {});
                  const date = x.createdAt ? new Date(x.createdAt).toLocaleString('es-CO') : '';
                  const count = Array.isArray(x.products) ? x.products.length : 0;
                  return `<div class="dp-history-row">
                    <div><b>${esc(w.productName || 'Investigación')}</b> — ${Number(w.overallScore)||0}/100<br><span class="muted">${esc(date)} · ${count} producto${count===1?'':'s'}</span></div>
                    <div class="dp-history-actions">
                      <button class="ghost" data-open="${esc(x.id)}">📂 Abrir</button>
                      <button class="ghost dp-danger" data-delete="${esc(x.id)}">🗑️ Eliminar</button>
                    </div>
                  </div>`;
                }).join('')}
                <div style="margin-top:12px"><button class="ghost dp-danger" id="dpClearHistory">🗑️ ELIMINAR TODO EL HISTORIAL</button></div>`;

              box.querySelectorAll('[data-open]').forEach(b=>{
                b.onclick = ()=>{
                  const item = getHistory().find(x=>x.id===b.dataset.open);
                  openSaved(item);
                };
              });

              box.querySelectorAll('[data-delete]').forEach(b=>{
                b.onclick = ()=>deleteSaved(b.dataset.delete);
              });

              const clear = document.getElementById('dpClearHistory');
              if(clear) clear.onclick = clearHistory;
            }

            function reset(){
              if(!confirm('¿Quieres iniciar una nueva investigación? Las investigaciones guardadas no se borrarán.')) return;
              for(let i=1;i<=5;i++){
                ['n','d','u','c','o','p'].forEach(x=>{
                  const e=document.getElementById(x+i);
                  if(e) e.value='';
                });
                if(document.getElementById('s'+i)) document.getElementById('s'+i).value='0';
                if(document.getElementById('r'+i)) document.getElementById('r'+i).value='5';
              }
              const r=document.getElementById('report');
              if(r){r.innerHTML='';r.style.display='none';}
              const e=document.getElementById('empty');
              if(e) e.style.display='block';
              lastData=null;
              lastProducts=null;
              lastCreatedAt=null;
              if(typeof window.updateProductCount==='function') window.updateProductCount();
              status('↺ Nueva investigación lista.');
              history();
            }

            function boot(){
              const demo = document.getElementById('demo');
              if(demo && !document.getElementById('dpReset')){
                const b=document.createElement('button');
                b.id='dpReset';
                b.className='ghost';
                b.textContent='↺ NUEVA INVESTIGACIÓN';
                b.onclick=reset;
                demo.parentNode.appendChild(b);
              }
              history();
              const report=document.getElementById('report');
              if(report && report.style.display==='block') tools();
              const mo=new MutationObserver(()=>{
                if(document.getElementById('report')?.style.display==='block') tools();
              });
              if(report) mo.observe(report,{childList:true,subtree:true});
            }

            setTimeout(boot,0);
          })();
          '''

          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('Marcador no encontrado.')

          suffix = '\n</script>\n\n</body>\n</html>'
          s = s[:idx] + patch.strip() + suffix
          p.write_text(s, encoding='utf-8')

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete saved reports history and download"
          git push
